name: Release Spec Kit Skills

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream Spec Kit tag to mirror (leave empty for the latest stable release)"
        required: false
        type: string
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: write

concurrency:
  group: spec-kit-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream release and skip existing mirrors
        id: upstream
        uses: actions/github-script@v8
        with:
          script: |
            const requestedTag = context.payload.inputs?.upstream_tag?.trim();
            const tag = requestedTag || (await github.rest.repos.getLatestRelease({
              owner: 'github',
              repo: 'spec-kit',
            })).data.tag_name;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('already_mirrored', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('already_mirrored', 'false');
            }
            core.setOutput('tag', tag);

      - uses: astral-sh/setup-uv@v7
        if: steps.upstream.outputs.already_mirrored != 'true'

      - name: Generate skills from the upstream release tag
        if: steps.upstream.outputs.already_mirrored != 'true'
        env:
          SPEC_KIT_REF: ${{ steps.upstream.outputs.tag }}
        run: ./scripts/sync.sh

      - name: Validate generated repository
        if: steps.upstream.outputs.already_mirrored != 'true'
        run: ./scripts/check.sh

      - name: Commit, tag, and publish the mirrored release
        if: steps.upstream.outputs.already_mirrored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            upstream_short_sha="$(python3 -c 'import json; print(json.load(open("UPSTREAM.json"))["commit"][:12])')"
            git add skills UPSTREAM.json THIRD_PARTY_NOTICES/spec-kit-LICENSE
            git commit -m "chore: sync spec-kit ${upstream_short_sha}"
            git push
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$UPSTREAM_TAG" >/dev/null; then
            echo "Tag $UPSTREAM_TAG already exists; continuing with release publication."
          else
            git tag -a "$UPSTREAM_TAG" -m "Mirror Spec Kit $UPSTREAM_TAG"
            git push origin "$UPSTREAM_TAG"
          fi
          gh release create "$UPSTREAM_TAG" --title "Spec Kit $UPSTREAM_TAG" --generate-notes
